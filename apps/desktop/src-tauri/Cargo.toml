[package]
name = "echoflux-desktop"
version = "0.1.0"
description = "EchoFlux Desktop Application"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "global-shortcut-all", "shell-open",
    "shell-open-api",
    "window-close",
    "window-hide",
    "window-show",
    "window-maximize",
    "window-minimize",
    "window-unmaximize",
    "window-unminimize",
    "window-start-dragging",
    "window-set-always-on-top",
    "window-set-size",
    "window-set-position",
    "window-set-decorations",
    "window-set-skip-taskbar",
    "process-exit",
    "fs-read-file",
    "fs-write-file",
    "fs-exists",
    "path-all",
    "dialog-save",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS credential vault. Only the Windows Credential Manager and macOS Keychain stores are
# enabled; other platforms get an explicit "unsupported" error instead of a mock store.
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }
zeroize = "1.8"
# OS CSPRNG for per-run engine tokens. 0.2 is already in the tree via tauri; MSRV 1.36.
getrandom = "0.2"
# Privileged control-role client for the loopback engine socket. Plain ws:// only (the
# engine binds 127.0.0.1), so no TLS backend is compiled in. tokio is already in the tree
# via tauri; these features add the TCP and timer drivers the client needs.
tokio = { version = "1", features = ["net", "time", "rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
